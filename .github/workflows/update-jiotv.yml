name: Update JioTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: jiotv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update JioTV playlist
        run: python scripts/jiotv_append_master.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f LiveTV/India/India-JioTV.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Auto-update JioTV playlist"
            git push
          fi
